global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'skillpulse-backend'
    static_configs:
      - targets: ['host.docker.internal:30080']
    metrics_path: /metrics

  - job_name: 'kube-state-metrics'
    static_configs:
      - targets: ['host.docker.internal:30081']
