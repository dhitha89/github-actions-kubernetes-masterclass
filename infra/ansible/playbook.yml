---
- name: Setup SkillPulse server
  hosts: skillpulse
  become: true

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - curl
          - wget
          - git
          - unzip
        state: present

    - name: Install k3s
      shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Wait for k3s to be ready
      wait_for:
        path: /etc/rancher/k3s/k3s.yaml
        state: present
        timeout: 60

    - name: Create .kube directory for ubuntu user
      file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Fix k3s kubeconfig permissions
      file:
        path: /etc/rancher/k3s/k3s.yaml
        mode: "0644"

    - name: Copy k3s kubeconfig for ubuntu user
      copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: /home/ubuntu/.kube/config
        remote_src: yes
        owner: ubuntu
        group: ubuntu
        mode: "0600"

    - name: Set KUBECONFIG in ubuntu bashrc
      lineinfile:
        path: /home/ubuntu/.bashrc
        line: 'export KUBECONFIG=/home/ubuntu/.kube/config'
        state: present

    - name: Install node_exporter
      shell: |
        wget -q https://github.com/prometheus/node_exporter/releases/download/v1.8.1/node_exporter-1.8.1.linux-amd64.tar.gz
        tar xzf node_exporter-1.8.1.linux-amd64.tar.gz
        mv node_exporter-1.8.1.linux-amd64/node_exporter /usr/local/bin/
        rm -rf node_exporter-1.8.1.linux-amd64*
      args:
        creates: /usr/local/bin/node_exporter

    - name: Create node_exporter systemd service
      copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Node Exporter
          After=network.target

          [Service]
          User=ubuntu
          ExecStart=/usr/local/bin/node_exporter
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start node_exporter
      systemd:
        name: node_exporter
        enabled: yes
        state: started
        daemon_reload: yes

    - name: Install Docker
      shell: curl -fsSL https://get.docker.com | sh
      args:
        creates: /usr/bin/docker

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Enable and start Docker
      systemd:
        name: docker
        enabled: yes
        state: started

    - name: Install docker-compose plugin
      apt:
        name: docker-compose-plugin
        state: present

    - name: Create monitoring directory on EC2
      file:
        path: /home/ubuntu/monitoring
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Copy prometheus config
      copy:
        src: ../../monitoring/prometheus.yml
        dest: /home/ubuntu/monitoring/prometheus.yml
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Copy monitoring docker-compose
      copy:
        src: ../../monitoring/docker-compose.yml
        dest: /home/ubuntu/monitoring/docker-compose.yml
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Start monitoring stack
      shell: docker compose -f /home/ubuntu/monitoring/docker-compose.yml up -d
      environment:
        HOME: /home/ubuntu

    - name: Verify k3s is running
      command: kubectl get nodes
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: k3s_nodes
      changed_when: false

    - name: Show k3s nodes
      debug:
        msg: "{{ k3s_nodes.stdout }}"
